[package]
name = "round-based"
version = "0.5.0-alpha.1"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Driver for MPC protocols"
repository = "https://github.com/LFDT-Lockness/round-based"
categories = ["asynchronous", "cryptography", "network-programming"]
keywords = ["round-based", "mpc", "protocol"]
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
phantom-type = { version = "0.3", default-features = false }
tracing = { version = "0.1", default-features = false }
thiserror = { version = "2", default-features = false }

round-based-derive = { version = "0.5.0-alpha.0", optional = true, path = "../round-based-derive" }

tokio = { version = "1", features = ["rt"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

pin-project-lite = "0.2"

# echo broadcast
digest = { version = "0.10", default-features = false, optional = true }
udigest = { version = "0.4", default-features = false, features = ["alloc", "digest", "inline-struct"], optional = true }

[dev-dependencies]
trybuild = "1"
matches = "0.1"
futures = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros"] }
hex = "0.4"

rand = "0.8"
rand_dev = "0.1"

anyhow = "1"

sha2 = "0.10"

[features]
default = []
state-machine = []
sim = ["state-machine"]
sim-async = ["sim", "tokio/sync", "tokio-stream", "futures-util/alloc"]
derive = ["round-based-derive"]
runtime-tokio = ["tokio"]

echo-broadcast = ["dep:digest", "dep:udigest"]

[[test]]
name = "derive"
required-features = ["derive"]

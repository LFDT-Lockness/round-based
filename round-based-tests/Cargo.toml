[package]
name = "round-based-tests"
version = "0.1.0"
edition.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
round-based = { path = "../round-based", features = ["echo-broadcast", "state-machine"] }

anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
hex-literal = "1.1"
hex = "0.4"
futures = "0.3"
matches = "0.1"
rand_chacha = "0.3"
sha2 = "0.10"

random-generation-protocol = { path = "../examples/random-generation-protocol", features = ["udigest"] }

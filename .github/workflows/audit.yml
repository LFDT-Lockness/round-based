name: Security audit

permissions:
  contents: read
on:
  pull_request:
    branches: [ "*" ]
    paths: 
      - '**/Cargo.toml'
      - '**/Cargo.lock'
jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 #v3
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 #v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

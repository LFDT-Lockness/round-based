name: Security audit

permissions:
  contents: read
on:
  pull_request:
    branches: [ "*" ]
    paths: 
      - '**/Cargo.toml'
      - '**/Cargo.lock'
jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 #v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
